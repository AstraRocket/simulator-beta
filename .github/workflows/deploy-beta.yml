name: Deploy beta

# Publishes the beta site, https://thzero.github.io/AstraRocketJs-beta/, from
# the beta branch of thzero/AstraRocketJs. The build lives there, in
# .github/workflows/beta-deploy.yml; this file is the "Run workflow" button.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: AstraRocket/simulator/.github/workflows/beta-deploy.yml@beta
