name: Deploy beta

# Publishes the beta site, https://astrarocket.github.io/simulator-beta/, from
# the beta branch of AstraRocket/simulator. The build lives there, in
# .github/workflows/channel-deploy.yml; this file is the "Run workflow" button.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: AstraRocket/simulator/.github/workflows/channel-deploy.yml@beta
    with:
      channel: beta
